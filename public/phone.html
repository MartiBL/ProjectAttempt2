<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gyro Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      overflow: hidden;
      user-select: none;
    }

    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #a78bfa, #6d28d9 60%, #2e1065);
      box-shadow: 0 0 60px #7c3aed88, 0 0 120px #4c1d9544;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
      margin-bottom: 40px;
      position: relative;
    }

    .orb::after {
      content: '';
      position: absolute;
      top: 18%;
      left: 22%;
      width: 30%;
      height: 20%;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      filter: blur(4px);
    }

    .orb.active {
      box-shadow: 0 0 80px #7c3aedcc, 0 0 160px #6d28d988;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.15em;
      margin-bottom: 48px;
    }

    .channel-box {
      background: #111118;
      border: 1px solid #2a2a40;
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
      margin-bottom: 24px;
      width: 88%;
      max-width: 320px;
    }

    .channel-label {
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .channel-id {
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      color: #7c3aed;
      font-weight: bold;
    }

    .status {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: #555;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .status.live {
      color: #4ade80;
    }

    .status.error {
      color: #f87171;
    }

    button#startBtn {
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 36px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 24px #7c3aed44;
      transition: all 0.2s;
      margin-top: 8px;
    }

    button#startBtn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 12px #7c3aed44;
    }

    button#startBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .data-row {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.1em;
    }

    .data-val {
      color: #7c3aed;
      min-width: 48px;
      text-align: right;
    }
  </style>
</head>

<body>

  <h1>Gyro Remote</h1>
  <p class="subtitle">Motion cursor controller</p>

  <div class="orb" id="orb"></div>

  <div class="channel-box">
    <div class="channel-label">Channel ID</div>
    <div class="channel-id" id="channelDisplay">——</div>
    <div class="status" id="statusText">generating channel...</div>
  </div>

  <button id="startBtn">Enable Gyro</button>

  <div class="data-row">
    <span>α <span class="data-val" id="dA">0°</span></span>
    <span>β <span class="data-val" id="dB">0°</span></span>
    <span>γ <span class="data-val" id="dG">0°</span></span>
  </div>

  <script>
    // We use a free public WebSocket echo/relay via piesocket or a BroadcastChannel polyfill
    // For local-network / same-browser use: BroadcastChannel (same origin)
    // For cross-device: use a tiny relay. We'll use wss://socketsbay.com/wss/v2/1/{channel}/
    // which is a free public WebSocket channel (no backend needed).

    const CHANNEL_KEY = 'gyroChannel';
    let channelId = sessionStorage.getItem(CHANNEL_KEY);
    if (!channelId) {
      channelId = Math.random().toString(36).slice(2, 8).toUpperCase();
      sessionStorage.setItem(CHANNEL_KEY, channelId);
    }

    document.getElementById('channelDisplay').textContent = channelId;

    const WS_URL = `wss://socketsbay.com/wss/v2/1/${channelId}/`;
    let ws = null;
    let active = false;

    const orb = document.getElementById('orb');
    const statusEl = document.getElementById('statusText');

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        statusEl.textContent = 'connected — share this ID with desktop';
        statusEl.className = 'status live';
      };
      ws.onclose = () => {
        statusEl.textContent = 'disconnected';
        statusEl.className = 'status error';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => {
        statusEl.textContent = 'connection error';
        statusEl.className = 'status error';
      };
    }

    connect();

    let lastSend = 0;
    function onOrientation(e) {
      if (!active) return;
      const now = Date.now();
      if (now - lastSend < 30) return; // ~33fps throttle
      lastSend = now;

      const alpha = e.alpha ?? 0;
      const beta = e.beta ?? 0;
      const gamma = e.gamma ?? 0;

      // Update debug display
      document.getElementById('dA').textContent = alpha.toFixed(1) + '°';
      document.getElementById('dB').textContent = beta.toFixed(1) + '°';
      document.getElementById('dG').textContent = gamma.toFixed(1) + '°';

      // Tilt the orb visually
      const tX = Math.max(-25, Math.min(25, gamma));
      const tY = Math.max(-25, Math.min(25, beta - 45));
      orb.style.transform = `rotateX(${-tY}deg) rotateY(${tX}deg)`;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'gyro', alpha, beta, gamma }));
      }
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      // iOS 13+ requires explicit permission
      if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            statusEl.textContent = 'permission denied';
            statusEl.className = 'status error';
            return;
          }
        } catch (err) {
          statusEl.textContent = 'permission error';
          statusEl.className = 'status error';
          return;
        }
      }

      active = true;
      orb.classList.add('active');
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').textContent = 'Transmitting...';
      window.addEventListener('deviceorientation', onOrientation, true);
    });
  </script>
</body>

</html>
